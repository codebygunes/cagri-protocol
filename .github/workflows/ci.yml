name: Çağrı Protocol CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Install Dependencies
      run: npm install

    - name: Run Signaling Server Test
      run: |
        echo "Starting WebRTC Signaling Server..."
        node src/signaling/server.js &
        sleep 5
        echo "Server successfully booted and maintained uptime!"